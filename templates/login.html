<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Seattle DOT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(180deg, #020817 0%, #020b16 100%);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .brand-badge {
            width: 3.25rem;
            height: 3.25rem;
            border-radius: 1rem;
            background: linear-gradient(135deg, #0ea5e9, #0f172a 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            letter-spacing: 0.1em;
            color: white;
            box-shadow: 0 0 24px rgba(14,165,233,0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
    <main class="w-full max-w-md bg-neutral-950 border border-neutral-800 rounded-2xl p-8 shadow-2xl">
        <div class="flex items-center gap-4 mb-8">
            <div class="brand-badge">SDOT</div>
            <div>
                <p class="text-xs uppercase tracking-[0.25em] text-sky-400 font-semibold">Seattle DOT</p>
                <h1 class="text-2xl font-bold text-white">Sign in to continue</h1>
            </div>
        </div>
        <p class="text-sm text-neutral-400 mb-6">A Roblox account is required to access corridor records and operational tools.</p>
        <a href="{{ url_for('roblox_login') }}" class="w-full inline-flex items-center justify-center gap-2 bg-sky-600 hover:bg-sky-700 text-white px-4 py-3 rounded-xl text-sm font-semibold transition">Continue with Roblox</a>
    </main>
</body>
</html>
